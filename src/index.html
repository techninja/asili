<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="app-version" content="0.0.0" />
    <meta name="app-commit" content="" />
    <!-- FOUC prevention -->
    <style>
      html,
      body {
        background: #0f172a;
        color: #e2e8f0;
        margin: 0;
      }
      [data-theme='light'],
      [data-theme='light'] body {
        background: #eef0f6;
        color: #1e293b;
      }
      @media (prefers-color-scheme: light) {
        html:not([data-theme]),
        body {
          background: #eef0f6;
          color: #1e293b;
        }
      }
    </style>
    <script>
      /* Apply stored theme immediately to prevent flash */
      try {
        const t =
          JSON.parse(localStorage.getItem('asili-appState') || '{}').theme ||
          (matchMedia('(prefers-color-scheme:light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
      } catch {}
    </script>
    <title>Asili — Privacy-first polygenic risk score analysis</title>
    <meta
      name="description"
      content="Upload your DNA file and explore polygenic risk scores for dozens of traits. Everything runs in your browser — we never see your data."
    />
    <meta property="og:title" content="Asili — Privacy-first polygenic risk scores" />
    <meta
      property="og:description"
      content="Upload your DNA file and explore polygenic risk scores for 64 traits — BMI, height, cholesterol, chronotype, and more. All processing happens in your browser. No servers, no accounts, no data leaves your device."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://app.asili.dev/" />
    <meta property="og:image" content="https://app.asili.dev/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Asili" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Asili — Privacy-first polygenic risk scores" />
    <meta
      name="twitter:description"
      content="Upload your DNA, get trait scores for 64 traits. All in your browser. No servers, no accounts, your data never leaves your device."
    />
    <meta name="twitter:image" content="https://app.asili.dev/assets/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Asili app showing polygenic risk scores for multiple traits"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>"
    />

    <script type="importmap">
      {
        "imports": {
          "hybrids": "/vendor/hybrids/index.js",
          "#store/": "/store/",
          "#utils/": "/utils/",
          "#atoms/": "/components/atoms/",
          "#molecules/": "/components/molecules/",
          "#organisms/": "/components/organisms/",
          "#templates/": "/components/templates/",
          "#pages/": "/pages/",
          "#locales/": "/locales/"
        }
      }
    </script>
    <link rel="stylesheet" href="/styles/components.css" />
  </head>
  <body>
    <noscript>
      <div
        style="
          font-family: system-ui;
          background: #0f172a;
          color: #e2e8f0;
          padding: 2rem;
          max-width: 40rem;
          margin: 4rem auto;
          text-align: center;
        "
      >
        <h1>JavaScript required</h1>
        <p>
          Asili requires JavaScript to run DNA analysis in your browser. Please enable it in your
          browser settings.
        </p>
      </div>
    </noscript>
    <app-router></app-router>
    <script type="module" src="/router/index.js"></script>
    <script>
      window.addEventListener('unhandledrejection', (e) => {
        console.error('[asili] Unhandled rejection:', e.reason);
      });
      window.addEventListener('error', (e) => {
        console.error('[asili] Uncaught error:', e.message, e.filename, e.lineno);
      });
    </script>
  </body>
</html>
